<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ДАНО / три напрямки</title>
<style>
:root{--bg:#101215;--fg:#eceef0;--dim:#8f979e;--line:#252b31}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:28px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
p.top{color:var(--dim);margin-top:6px;font-size:14.5px}
.grid{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.col{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#15181c}
.head b{font-size:15px}
.head span{font-size:12.5px;color:var(--dim)}
.head a{font-size:12.5px;color:#7fd4ff;text-decoration:none}
.frame{height:74vh;position:relative}
iframe{position:absolute;inset:0;width:1440px;height:calc(74vh / 0.32);border:0;transform:scale(.32);transform-origin:top left}
@media (max-width:1100px){.grid{grid-template-columns:1fr}iframe{width:1440px;transform:scale(.55);height:calc(74vh / 0.55)}}
</style>
</head>
<body>
<h1>ДАНО: три напрямки лендингу</h1>
<p class="top">Прев'ю зменшене. Тисни «відкрити» щоб подивитись напрямок у повний розмір і поклікати.</p>
<div class="grid">
  <div class="col">
    <div class="head"><b>A. Сигнал</b><span>темний, інженерний</span><a href="a-signal.html" target="_blank">відкрити</a></div>
    <div class="frame"><iframe src="a-signal.html" loading="lazy"></iframe></div>
  </div>
  <div class="col">
    <div class="head"><b>B. Документ</b><span>світлий, редакційний</span><a href="b-document.html" target="_blank">відкрити</a></div>
    <div class="frame"><iframe src="b-document.html" loading="lazy"></iframe></div>
  </div>
  <div class="col">
    <div class="head"><b>C. Діалог</b><span>темний, демо-перший</span><a href="c-dialog.html" target="_blank">відкрити</a></div>
    <div class="frame"><iframe src="c-dialog.html" loading="lazy"></iframe></div>
  </div>
</div>
</body>
</html>
